services:
  bookit-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabasePassword: ${BOOKIT_DB_PASSWORD}
      ConnectionStrings__DefaultConnection: Host=${NAS_HOST:-lab26-nas};Port=5432;Database=lab_equipment_booking;Username=booking_app;
    ports:
      - "5001:5000"
    restart: unless-stopped

  bookit-web:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "8081:80"
    depends_on:
      - bookit-api
    restart: unless-stopped