services:
  bookit-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      UseInMemoryDatabase: "false"
      DatabasePassword: ${BOOKIT_DB_PASSWORD:?Set BOOKIT_DB_PASSWORD in qnap.env}
      ConnectionStrings__DefaultConnection: Host=132.72.15.186;Port=5432;Database=lab_equipment_booking;Username=booking_app;Password=${BOOKIT_DB_PASSWORD:?Set BOOKIT_DB_PASSWORD in qnap.env};
    volumes:
      - /share/Container/bookit-postgres/exports:/app/exports
    ports:
      - "5050:5000"
    restart: unless-stopped

  bookit-web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in qnap.env}
    ports:
      - "8090:80"
    depends_on:
      - bookit-api
    restart: unless-stopped
